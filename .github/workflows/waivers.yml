name: Waiver watch
on:
  schedule:
    - cron: '23 * * * *'    # hourly: r/DynastyFF buzz and injury openings, posted as soon as they appear
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/waivers.mjs
        env:
          SLEEPER_USER: boximax
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/waivers.json; git diff --cached --quiet || git commit -m "Waiver watch $(date -u +%F)"; git pull --rebase; git push
