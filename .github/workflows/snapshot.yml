name: Weekly snapshot

on:
  schedule:
    - cron: '17 9 * * 2'   # Tuesdays 09:17 UTC, after Monday Night Football
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
        env:
          SLEEPER_USER: boximax
      - name: Commit snapshot
        run: |
          git config user.name "dynasty-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Weekly snapshot $(date -u +%F)"
          git push
