name: Podcast buzz
on:
  schedule:
    - cron: '17 4 * * *'    # daily: new dynasty podcast episodes -> player takes (data/buzz.json)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: podcasts, cancel-in-progress: false }
jobs:
  buzz:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1
      - run: pip install --quiet faster-whisper requests
      - run: python scripts/podcasts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_MIN: '240'
      - if: always()
        run: |
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/buzz.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Podcast buzz $(date -u +%F)"; git pull --rebase; git push
