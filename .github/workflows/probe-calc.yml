name: Probe calculators
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 dynasty-hq personal" https://keeptradecut.com/dynasty-rankings -o /tmp/k.html
          node -e '
            const s=require("fs").readFileSync("/tmp/k.html","utf8");const m=s.match(/var playersArray = (\[.*?\]);/s);
            if(!m){console.log("no playersArray");process.exit()}
            const a=JSON.parse(m[1]);const f=n=>a.find(x=>x.playerName===n);
            for(const n of ["Josh Allen","Jahmyr Gibbs","Jaxon Smith-Njigba","D'"'"'Andre Swift"]){const p=f(n);console.log("KTC",n,p&&p.superflexValues&&p.superflexValues.value,p&&p.oneQBValues&&p.oneQBValues.value)}'
