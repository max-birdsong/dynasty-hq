name: Owner scan
on:
  schedule:
    - cron: '17 10 * * 2'   # Tuesdays 10:17 UTC, after the week's games
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/owners.mjs']   # re-run when the scan changes
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/owners.mjs
        env: { SLEEPER_USER: boximax }
      - run: |
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/owners.json data/real-trades.json; git diff --cached --quiet || git commit -m "Owner scan $(date -u +%F)"; git pull --rebase; git push
