name: Probe Sleeper
on:
  push:
    paths: ['scripts/probe.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/debug; git diff --cached --quiet || git commit -m "Probe output"; git pull --rebase; git push
