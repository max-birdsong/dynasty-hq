name: Probe FC trades (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-fc.yml', 'scripts/probe_fc.py']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/probe_fc.py
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add data/probe-fc.txt; git commit -m "probe"; git pull --rebase; git push
