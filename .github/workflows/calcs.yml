name: Calculator values
on:
  schedule:
    - cron: '41 5 * * *'   # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/calcs.mjs
      - run: |
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/calcs.json; git diff --cached --quiet || git commit -m "Calculator values $(date -u +%F)"; git pull --rebase; git push
